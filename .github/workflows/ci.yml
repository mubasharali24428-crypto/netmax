name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python engine + bridge tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Prime matplotlib font cache (avoids subprocess in offline tests)
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot"

      - name: Run engine + bridge suite (177 tests)
        run: python -m pytest -q

      - name: Bridge offline selftest
        run: python desktop/bridge/engine_bridge.py selftest

  swift-build:
    name: Swift app release build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        working-directory: desktop/SwiftNetMax
        run: |
          BIN_PATH=$(swift build -c release --show-bin-path)
          echo "BIN_PATH=$BIN_PATH" >> $GITHUB_ENV
          swift build -c release
          ls -la "$BIN_PATH" | head -10

      - name: Verify binary exists
        run: test -x "$BIN_PATH/netmax-desktop" && echo "binary OK"

  bundle-package:
    name: App bundle + codesign
    runs-on: macos-14
    needs: [swift-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        working-directory: desktop/SwiftNetMax
        run: swift build -c release

      - name: Build app bundle
        working-directory: desktop
        run: bash scripts/build_app.sh

      - name: Codesign verify (ad-hoc)
        working-directory: desktop
        run: |
          codesign -v build/NetMaxDesktop.app && echo "codesign OK"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMaxDesktop-app
          path: desktop/build/NetMaxDesktop.app
          retention-days: 7
