name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python engine + bridge tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check . --exclude .venv --exclude desktop/SwiftNetMax/.build --exclude desktop/node_modules --exclude desktop/build

      - name: Prime matplotlib font cache (avoids subprocess in offline tests)
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot"

      - name: Engine mirror parity check (C-08)
        run: python scripts/check_engine_mirrors.py

      - name: Targeted module coverage checks (C-10, C-11, C-12, C-13)
        run: |
          python -m pytest tests/test_fetch_mcp_boundary.py tests/test_fetch_url_policy.py tests/test_netmax_fetch.py --cov=netmax_fetch --cov-report=term-missing --cov-fail-under=90
          python -m pytest tests/test_ai_endpoint_policy.py tests/test_ai_egress_policy.py tests/test_netmax_ai_provider.py --cov=netmax_ai_provider --cov-report=term-missing --cov-fail-under=90
          python -m pytest tests/test_pf_transactional.py tests/test_pf_locking.py tests/test_netmax_shape.py --cov=netmax_shape --cov-report=term-missing --cov-fail-under=90
          python -m pytest desktop/bridge/test_engine_bridge.py --cov=desktop/bridge --cov-report=term-missing --cov-fail-under=90

      - name: Run engine + bridge suite (with coverage, >= 85% gate)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Python coverage XML
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Bridge offline selftest
        run: python desktop/bridge/engine_bridge.py selftest

      # W18 / audit F20: the SQLite layer is adopted (opt-in migration) and
      # its 38 tests run standalone — keep them green in CI forever.
      - name: engine_store suite (SQLite layer, F20)
        run: python -m pytest desktop/engine_store/test_store.py -q -n auto

      # Wave-1 (audit items 4/76): the three in-repo version pins must agree —
      # server.json drifted to 1.0.6 silently once already. (Homebrew cask lives
      # in a separate tap repo; sync_versions.sh covers it at release time.)
      - name: Version pins agree (pyproject/package.json/server.json)
        run: |
          python -c "import json, tomllib; py = tomllib.load(open('pyproject.toml','rb'))['project']['version']; pkg = json.load(open('desktop/package.json'))['version']; srv = json.load(open('server.json')); assert len({py, pkg, srv['version'], srv['packages'][0]['version']}) == 1, (py, pkg, srv); print('versions agree:', py)"

  security-scans:
    name: Security scans (pip-audit, bandit, semgrep)
    # A-03: one documented command per scanner, all pinned in
    # requirements-ci.txt. Local setup: pip install -r requirements-ci.txt
    # then run the same three commands below.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install pinned scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1 bandit==1.9.4 semgrep==1.179.0

      # Gate: any known-vulnerable pinned dependency fails CI.
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements-ci.txt

      # Gate: fails on High only — the release-blocking severity per the
      # roadmap severity gate. Medium/Low findings are reported for
      # product-owner disposition (an AI agent cannot accept that risk).
      # Excluded: build artifacts, vendored deps, and test fixtures —
      # none are shipped product code paths.
      - name: Static analysis (bandit, High = gate)
        run: bandit -r . -lll -x './.git,./.venv,./node_modules,./output,./tmp,./results,./desktop/SwiftNetMax/.build,./desktop/build,./tests'

      # Gate: community python rules; any finding fails CI.
      - name: Semgrep (p/python, blocking)
        run: semgrep --config=p/python --error .

  mcp-concurrency-smoke:
    name: MCP transport concurrency smoke (loopback, offline)
    # ubuntu on purpose: the probe only exercises the HTTP transport with
    # side-effect-free session_info — no engine spawn, no measurement, no
    # macOS WiFi. Full parallel_diagnostics e2e stays manual
    # (desktop/web-mcp-test-concurrency.mjs needs live network).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install MCP server deps
        run: npm ci --no-audit --no-fund

      - name: Syntax gate
        run: npm test

      - name: VS Code extension tests
        working-directory: plugins/vscode
        run: npm ci && npm test

      - name: Start server (loopback) + run parallel smoke
        run: |
          node netmax-mcp-server.mjs --http &
          SRV=$!
          sleep 2
          node web-mcp-smoke.mjs 8808
          STATUS=$?
          kill $SRV 2>/dev/null
          exit $STATUS

      - name: TLS + dashboard smoke (self-signed, loopback)
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/ci-key.pem -out /tmp/ci-cert.pem \
            -days 1 -nodes -subj "/CN=localhost"
          NETMAX_TLS_CERT=/tmp/ci-cert.pem NETMAX_TLS_KEY=/tmp/ci-key.pem \
            NETMAX_PORT=8814 node netmax-mcp-server.mjs --http &
          SRV=$!
          sleep 2
          curl -sk https://127.0.0.1:8814/ | grep -q "toolCalls" || exit 1
          curl -sk https://127.0.0.1:8814/ | grep -q "https" || exit 1
          kill $SRV 2>/dev/null
          rm -f /tmp/ci-cert.pem /tmp/ci-key.pem
          echo "tls+dashboard OK"

      - name: Fleet aggregation smoke (stdlib stub peers)
        run: |
          mkdir -p /tmp/peerA /tmp/peerB
          echo "peer A dashboard" > /tmp/peerA/index.html
          echo "peer B dashboard" > /tmp/peerB/index.html
          python3 -m http.server 8815 --directory /tmp/peerA >/dev/null 2>&1 &
          P1=$!
          python3 -m http.server 8816 --directory /tmp/peerB >/dev/null 2>&1 &
          P2=$!
          NETMAX_FLEET="desk=http://127.0.0.1:8815,mini=http://127.0.0.1:8816" \
            NETMAX_PORT=8817 node netmax-mcp-server.mjs --http &
          SRV=$!
          sleep 2
          curl -s http://127.0.0.1:8817/fleet | tee /tmp/fleet.json | grep -q '"ok": true'
          grep -q '"desk"' /tmp/fleet.json && grep -q '"mini"' /tmp/fleet.json
          curl -s http://127.0.0.1:8817/fleet/board | grep -q 'NetMax fleet (2 peers)'
          STATUS=$?
          kill $SRV $P1 $P2 2>/dev/null
          exit $STATUS

  swift-build:
    name: Swift app release build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build (release)
        working-directory: desktop/SwiftNetMax
        run: |
          BIN_PATH=$(swift build -c release --show-bin-path)
          echo "BIN_PATH=$BIN_PATH" >> $GITHUB_ENV
          swift build -c release
          ls -la "$BIN_PATH" | head -10

      - name: Verify binary exists
        run: test -x "$BIN_PATH/netmax-desktop" && echo "binary OK"

      - name: Swift offline selftests
        working-directory: desktop
        run: bash scripts/run_swift_selftests.sh

      # A-03: the SPM test target (Package.swift .testTarget) must
      # run in CI — the compile-probe above does not execute it.
      - name: Swift package tests (SPM)
        working-directory: desktop/SwiftNetMax
        run: swift test

  bundle-package:
    name: App bundle + codesign
    runs-on: macos-14
    timeout-minutes: 30
    needs: [swift-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build (release universal)
        working-directory: desktop/SwiftNetMax
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Build app bundle
        working-directory: desktop
        run: bash scripts/build_app.sh

      - name: Assert universal slices (lipo) and Info.plist
        working-directory: desktop
        run: |
          lipo -info build/NetMaxDesktop.app/Contents/MacOS/NetMaxDesktop | grep -q 'arm64'
          lipo -info build/NetMaxDesktop.app/Contents/MacOS/NetMaxDesktop | grep -q 'x86_64'
          plutil -lint build/NetMaxDesktop.app/Contents/Info.plist
          echo "universal architecture and Info.plist OK"

      - name: Codesign verify (ad-hoc)
        working-directory: desktop
        run: |
          codesign -v build/NetMaxDesktop.app && echo "codesign OK"

      # W18 (audit F2 follow-up): deep seal check — catches any resource
      # added after signing (e.g. __pycache__ from a stray engine run).
      - name: Deep seal integrity check (F2 follow-up)
        working-directory: desktop
        run: |
          codesign -v --deep --strict build/NetMaxDesktop.app \
            && echo "deep seal OK"

      # W18: engine-dir permission gate — the shipped bundle's engine files
      # must NOT be group/world-writable (the integrity check refuses to
      # auto-run in that state, so a bad bundle must fail CI here).
      #
      # Two traps this gate previously fell into, both of which made it
      # useless rather than loud:
      #   1. `0o022` is a C-style prefix bash rejects ("value too great for
      #      base"), so $(( )) errored, expanded to nothing, and every
      #      comparison silently passed. The gate never once fired.
      #   2. Without the 0 prefix, MODE="755" is read as DECIMAL 755, which
      #      ANDs non-zero against 022 — flagging every clean directory.
      # The self-test below fails if either regresses, because a gate that
      # always passes is worse than no gate at all.
      - name: Engine dir permission gate (022 bits must be clear)
        working-directory: desktop
        run: |
          set -euo pipefail

          # Self-test: prove the mask actually discriminates before trusting it.
          for probe in 755:0 700:0 644:0 775:1 777:1 666:1; do
            want=${probe#*:}
            got=$(( 0${probe%%:*} & 0022 ))
            if [ $(( got != 0 ? 1 : 0 )) -ne "$want" ]; then
              echo "::error::permission mask self-test failed for mode ${probe%%:*} (got $got, want nonzero=$want)"
              exit 1
            fi
          done
          echo "permission mask self-test OK"

          BAD=0
          shopt -s nullglob
          for f in build/NetMaxDesktop.app/Contents/Resources/engine/*.py; do
            MODE=$(stat -f '%Lp' "$f")
            if [ $(( 0$MODE & 0022 )) -ne 0 ]; then
              echo "::error::group/world-writable engine file: $f (mode $MODE)"
              BAD=1
            fi
          done
          shopt -u nullglob
          DIRMODE=$(stat -f '%Lp' build/NetMaxDesktop.app/Contents/Resources/engine)
          if [ $(( 0$DIRMODE & 0022 )) -ne 0 ]; then
            echo "::error::group/world-writable engine dir (mode $DIRMODE)"
            BAD=1
          fi
          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi
          echo "engine perms OK"

      - name: Upload app artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: NetMaxDesktop-app
          path: desktop/build/NetMaxDesktop.app
          retention-days: 7
